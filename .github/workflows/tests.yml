name: Stripe API Tests

on:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Allure
        run: |
          wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      - name: Run tests
        run: pytest tests/ -v --alluredir=allure-results
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Generate Allure report
        if: always()
        run: allure generate allure-results --clean -o allure-report

      - name: Send Telegram notification
        if: always()
        run: |
          PASSED=$(find allure-results -name "*-result.json" -exec grep -l '"status": "passed"' {} \; | wc -l)
          FAILED=$(find allure-results -name "*-result.json" -exec grep -l '"status": "failed"' {} \; | wc -l)
          TOTAL=$((PASSED + FAILED))
          if [ "${{ job.status }}" == "success" ]; then
            MSG="✅ Stripe API Tests%0A%0A✔ Passed: $PASSED%0A❌ Failed: $FAILED%0A📊 Total: $TOTAL"
          else
            MSG="❌ Stripe API Tests FAILED%0A%0A✔ Passed: $PASSED%0A❌ Failed: $FAILED%0A📊 Total: $TOTAL"
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
          -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
          -d text="$MSG"

      - name: Debug allure results
        if: always()
        run: |
          echo "=== Files in allure-results ==="
          ls -la allure-results/ || echo "Directory empty or missing"
          echo "=== First file content ==="
          cat allure-results/*.json 2>/dev/null | head -50 || echo "No json files"

      - name: Deploy Allure to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          publish_branch: gh-pages